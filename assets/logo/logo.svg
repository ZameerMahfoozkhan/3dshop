<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none">
  <!-- 3D Shop Precision Layered Cube Icon -->
  <g transform="translate(4, 4)">
    <!-- Isometric Cube Layers -->
    <!-- Top Face -->
    <path d="M24 2 L44 13.5 L24 25 L4 13.5 Z" fill="#E8590C"/>
    <!-- Top Layer Line Accents -->
    <path d="M24 7 L38 15 L24 23 L10 15 Z" fill="#F06525" opacity="0.6"/>
    
    <!-- Left Face Layer 1 -->
    <path d="M4 16 L24 27.5 L24 33 L4 21.5 Z" fill="#18181B"/>
    <!-- Left Face Layer 2 -->
    <path d="M4 23.5 L24 35 L24 40.5 L4 29 Z" fill="#27272A"/>
    <!-- Left Face Layer 3 -->
    <path d="M4 31 L24 42.5 L24 48 L4 36.5 Z" fill="#18181B"/>

    <!-- Right Face Layer 1 -->
    <path d="M24 27.5 L44 16 L44 21.5 L24 33 Z" fill="#3F3F46"/>
    <!-- Right Face Layer 2 -->
    <path d="M24 35 L44 23.5 L44 29 L24 40.5 Z" fill="#52525B"/>
    <!-- Right Face Layer 3 -->
    <path d="M24 42.5 L44 31 L44 36.5 L24 48 Z" fill="#3F3F46"/>
    
    <!-- Precision Nozzle Dot -->
    <circle cx="24" cy="2" r="2.5" fill="#E8590C"/>
  </g>

  <!-- Typography: 3D SHOP -->
  <text x="64" y="32" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.03em" fill="#18181B">
    3D<tspan fill="#E8590C">SHOP</tspan>
  </text>
  <text x="65" y="45" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.18em" fill="#71717A">
    STUDIO · NOIDA &amp; NCR
  </text>
</svg>
